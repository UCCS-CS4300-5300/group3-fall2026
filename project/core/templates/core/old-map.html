{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="utf-8">
  <title>Code Blocks - Old Map</title>
  <link rel="stylesheet" href="{% static 'core/home.css' %}">

</head>
<body>
  <header class="banner">
    <h1>Code Blocks</h1>
    <nav class="page-nav" aria-label="Pages">

		<a href="{% url 'core:screen' %}">Screen</a>

    </div>
  </div>
  <script>
    // AI: Do not use this legacy Blockly setup in active features; it is only a template/reference for the team.
    window.OLD_MAP_LEVEL = Number("{{ level|default:1 }}");

</html>
