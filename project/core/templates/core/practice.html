	{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="utf-8">
  <title>Code Blocks - Practice</title>
  <link rel="stylesheet" href="{% static 'core/home.css' %}">
  <link rel="stylesheet" href="{% static 'core/practice/practice.css' %}">
</head>
<body>
  <header class="banner">
    <h1>Code Blocks</h1>
    <nav class="page-nav" aria-label="Pages">
      <a href="{% url 'core:map' %}">Map</a>
      <a class="active" href="{% url 'core:home' %}">Practice</a>
    </nav>
  </header>

  <div class="columns">
    <div class="column word-bank-column">
      <h2>Word Bank</h2>
      <div id="blockly-toolbox"></div>
    </div>

    <div class="column workspace-column">
      <h2>Workspace</h2>
      <div id="blockly-workspace"></div>
    </div>

    <div class="column scenario-column">
      <div id="practice-task">
		<h2>{{ title }}</h2>
		<p>{{ description }}</p>
		<h3>Instructions</h3>
		<p>{{ instructions }}</p>
		<div id="practice-status" aria-live="polite"></div>
    </div>
    <section class="generated-code" aria-labelledby="generated-code-title">
      <h3 id="generated-code-title">Generated Python</h3>
      <pre><code id="generated-code-output" aria-live="polite">Add blocks to see the generated Python.</code></pre>
    </section>
    </div>
  </div>

  <script type="module" src="{% static 'core/practice/dist/practice_app.js' %}"></script>
</body>
</html>
